resolved:
- key: BL-E001-001
  epic: '001'
  sprint: ''
  title: Gitea release creates the tag at GITHUB_SHA, which does not exist in a different target repo
  source: CI/CD review 2026-09-21 / E2E run 35630877931
  severity: High
  status: resolved
  description: "src/platform/gitea.ts:110-121 (createRelease) resolves the commit SHA for a not-yet-existing tag as: 1) config.commit input, 2) process.env.GITHUB_SHA, 3) getDefaultBranchSha() of the target repo. Step 2 is wrong whenever the target repository is not the repository the workflow runs in, which is the cross-forge case this action exists for. GITHUB_SHA is the running workflow's commit and generally does not exist in the target Gitea repo, so Gitea answers: HTTP 404 'target not found: object does not exist [id: <sha>, rel_path: ]'. Observed in E2E run 35630877931 where the id was the commit just pushed to git-action-release itself. Callers that pass 'commit' explicitly never hit it, which is why it went unnoticed; it was invisible entirely while the Gitea E2E cell silently skipped. Proposed fix: prefer getDefaultBranchSha() and only trust GITHUB_SHA when the target repo is the current repo (compare against GITHUB_REPOSITORY and the resolved base URL). Needs a dist rebuild and a release. The E2E gitea cell is currently continue-on-error so this reports without blocking releases."
  resolution: fixed
  resolved_at: '2026-09-21T22:50:06Z'
  ref: c564e18c6a0d2d1bf0acfc5ecc9b45751552bbc3
  note: "Two defects in one path, released as v2.0.11. 4fcf0ac: the environment SHA is trusted only when the workflow provably runs on the target forge, compared by host. c564e18: getDefaultBranchSha read .object.sha off Gitea's array-shaped git/refs response - unreachable dead code until the first fix removed the GITHUB_SHA short-circuit. Verified by E2E run 35664013909 (both cells green against live Gitea) and release run 35664336430, which passed with the Gitea cell restored to blocking."
