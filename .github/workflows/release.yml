name: Release

on:
  push:
    tags:
      - 'v*.*.*'  # Semver tags only
  workflow_dispatch:  # Allow manual triggering
    inputs:
      tag:
        description: 'Tag to release (e.g., v1.0.0)'
        required: true
        type: string

concurrency:
  # Same group for same release whether triggered by push (tag) or workflow_dispatch (inputs.tag)
  group: ${{ github.workflow || 'Release' }}-${{ github.event.inputs.tag || github.ref_name || github.ref || github.run_id }}
  cancel-in-progress: false

# Floor for every job in this file. Deleting this block would NOT narrow anything -- jobs
# would fall back to the repository default, which may be write-all.
permissions:
  contents: read
  pull-requests: read

jobs:
  ci:
    # `$/` is GitHub syntax from July 2026 and act 0.2.89 rejects it outright ("must start
    # with './' if it's a local workflow"), which would break every `npm run test:act:*`
    # script here. The marker must sit ON the uses: line -- a comment above a JOB-level
    # uses: is not honoured, unlike the step-level case.
    uses: ./.github/workflows/ci.yml  # zizmor: ignore[self-repository]
    # Same-repo reusable workflow runs from caller commit (on tag push = tag commit)
    secrets:
      NPM_REGISTRY_TOKEN: ${{ secrets.NPM_REGISTRY_TOKEN }}

  e2e-tests:
    needs: ci  # E2E tests run after CI passes
    # See the note on the ci job above; act rejects `$/`.
    uses: ./.github/workflows/e2e-tests.yml  # zizmor: ignore[self-repository,secrets-inherit]
    # The secrets-inherit marker above (a JOB-level uses: only honours a trailing
    # marker, not a comment above it) — inherit is the only mechanism that works here,
    # and this was established empirically, not assumed.
    #
    # e2e-tests.yml reads TEST_GITHUB_TOKEN and TEST_GITEA_TOKEN. Both are ENVIRONMENT
    # secrets of the TEST environment (checked against the repository's environment
    # secret list); neither exists at repository or organisation level. So they cannot
    # be passed explicitly: a job that calls a reusable workflow may not declare
    # `environment:`, and in this caller `${{ secrets.TEST_GITHUB_TOKEN }}` expands to
    # the empty string.
    #
    # Dropping the block entirely does not work either, even though the callee's job
    # does declare `environment: TEST`. Release run 33900517466 was built that way and
    # its GitHub E2E cell failed at "Test - Create release" with `TEST_TOKEN:` logged
    # empty; the same cell passed in run 33881117739, which used inherit.
    secrets: inherit

  release:
    permissions:
      contents: write   # creates the release and moves the floating tags
    needs: [ci, e2e-tests]
    # Proceed when CI passed; allow release even if e2e-tests failed (e.g. Gitea unconfigured)
    if: always() && !cancelled() && needs.ci.result == 'success'
    runs-on: ubuntu-latest
    env:
      NPM_REGISTRY_TOKEN: ${{ secrets.NPM_REGISTRY_TOKEN }}
    steps:
      - name: Checkout code
        # zizmor: ignore[artipacked] — the floating-tags step later in this job
        # force-pushes vX/vX.Y using these persisted credentials; disabling them
        # breaks the release, and only at release time. The floating-version action
        # has no `token` input and no token handling in its src/ at all.
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0  # Full history for changelog generation
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Parse and validate version tag
        id: version
        # zizmor: ignore[unpinned-uses] — first-party action; no Renovate or
        # Dependabot exists in these repos, so a SHA pin would freeze it and stop
        # security fixes reaching us through @v2.
        uses: LiquidLogicLabs/git-action-tag-validate-version@v2
        with:
          tag: ${{ github.event.inputs.tag || github.ref_name }}
          version-type: 'auto'

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          # setup-node enables package-manager caching by default; a cache
          # restored from a PR run must not reach a publishing job.
          package-manager-cache: false
          # This job installs git-platform-detector from the private Gitea registry, which
          # returns 401 without a token. It previously had no registry configuration at all
          # and only succeeded because `cache: 'npm'` happened to restore the tarball from
          # an earlier run -- authentication by cache warmth. registry-url makes setup-node
          # write the auth .npmrc to RUNNER_TEMP, never into the workspace.
          registry-url: 'https://git.ravenwolf.org/api/packages/liquidlogiclabs/npm/'
          scope: '@liquidlogiclabs'

      - name: Install dependencies
        run: npm ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_REGISTRY_TOKEN }}

      - name: Build and package action
        run: npm run package

      - name: Verify packaged output is committed
        run: |
          # Only require the runtime bundle (index.js, index.js.map) to match; .d.ts.map can differ (paths)
          if ! git diff --quiet dist/index.js dist/index.js.map 2>/dev/null; then
            echo "::error::dist/index.js or dist/index.js.map changed after packaging. Run 'npm run package' and commit dist/."
            git diff --stat dist/index.js dist/index.js.map
            exit 1
          fi
          echo "Runtime bundle (dist/index.js, dist/index.js.map) is committed."

      - name: Generate release notes
        id: release_notes
        uses: mikepenz/release-changelog-builder-action@cb021f9b36a51a7c6f18e4679b6fa2cb77a1260c # v6
        with:
          mode: "HYBRID"
          configurationJson: |
            {
              "template": "#{{CHANGELOG}}\n\n<details>\n<summary>Pull Requests</summary>\n\n#{{PR_LIST}}\n</details>\n\n---\n\n### Usage\n\n```yaml\n- uses: LiquidLogicLabs/git-action-release@${{ github.ref_name }}\n  with:\n    tag: 'v1.0.0'\n    token: ${{ secrets.GITHUB_TOKEN }}\n```"
            }
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create/Update Major and Minor Version Tags
        if: steps.version.outputs.has-prerelease != 'true' && steps.version.outputs.is-valid == 'true'
        # zizmor: ignore[unpinned-uses] — first-party action; no Renovate or
        # Dependabot exists in these repos, so a SHA pin would freeze it and stop
        # security fixes reaching us through @v2.
        uses: LiquidLogicLabs/git-action-tag-floating-version@v2
        with:
          tag: ${{ github.event.inputs.tag || github.ref_name }}
          # Without this the minor tag (vX.Y) is never moved: the action defaults it to
          # false, so every repo left vX.Y frozen at an old release while the summary
          # below claimed it had been created.
          update-minor: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true  # e.g. token cannot force-push existing tags; release still created below

      - name: Create GitHub Release
        # zizmor: ignore[superfluous-actions] — the runner does ship `gh release
        # create`, but this repository IS LiquidLogicLabs/git-action-release, so it
        # cannot use the house first-party release action without releasing itself
        # with an unreleased build. Swapping the release mechanism of the action every
        # other repo depends on is a behaviour change, not a security fix.
        uses: ncipollo/release-action@339a81892b84b4eeb0f6e744e4574d79d0d9b8dd # v1
        with:
          tag: ${{ github.event.inputs.tag || github.ref_name }}
          name: Release ${{ steps.version.outputs.version }}
          body: ${{ steps.release_notes.outputs.changelog }}
          draft: false
          prerelease: ${{ steps.version.outputs.has-prerelease == 'true' }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Release Summary
        env:
          Z_VERSION_OUTPUTS_VERSION: ${{ steps.version.outputs.version }}
          Z_REPOSITORY: ${{ github.repository }}
          Z_EVENT_INPUTS_TAG_GITHUB_REF_NAME: ${{ github.event.inputs.tag || github.ref_name }}
          Z_VERSION_OUTPUTS_HAS_PRERELEASE: ${{ steps.version.outputs.has-prerelease }}
          Z_VERSION_OUTPUTS_MAJOR: ${{ steps.version.outputs.major }}
          Z_VERSION_OUTPUTS_MINOR: ${{ steps.version.outputs.minor }}
          Z_REF_NAME: ${{ github.ref_name }}
        run: |
          {
            echo "## 🎉 Release Complete!"
            echo ""
            echo "- **Version**: ${Z_VERSION_OUTPUTS_VERSION}"
            echo "- **GitHub Release**: [View Release](https://github.com/${Z_REPOSITORY}/releases/tag/${Z_EVENT_INPUTS_TAG_GITHUB_REF_NAME})"
            if [ "${Z_VERSION_OUTPUTS_HAS_PRERELEASE}" == "true" ]; then
              echo "- **Status**: ⚠️ Pre-release (for testing)"
            else
              echo "- **Status**: ✅ Stable release"
              echo "- **Version Tags Created**: \`@v${Z_VERSION_OUTPUTS_MAJOR}\`, \`@v${Z_VERSION_OUTPUTS_MAJOR}.${Z_VERSION_OUTPUTS_MINOR}\`, \`@${Z_REF_NAME}\`"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
