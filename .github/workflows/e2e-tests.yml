# E2E tests for GitHub and Gitea. Enable platforms via repository/environment variables:
# - GitHub: always runs (uses TEST_GITHUB_TOKEN and vars.TEST_GITHUB_REPO when set).
# - Gitea: runs only when vars.TEST_GITEA_REPO is set (and TEST_GITEA_TOKEN in TEST env).
name: E2E Tests

on:
  workflow_call:  # Called by release workflow
  workflow_dispatch:  # Manual trigger only

concurrency:
  # Fallbacks so group is valid on GitHub, Gitea, and act (e.g. workflow_dispatch has no ref)
  group: ${{ github.workflow || 'E2E Tests' }}-${{ github.ref || github.sha }}
  cancel-in-progress: true

permissions:
  # contents: read, not write. Every release/tag this workflow creates targets the
  # separate TEST repository and is authenticated with TEST_TOKEN, never GITHUB_TOKEN --
  # nothing here writes to this repository.
  #
  # It also cannot be `write` any more: release.yml now runs on a `contents: read` floor
  # (R8), and a called reusable workflow may not request more than its caller was granted.
  # Leaving `write` here made the v2.0.5 Release run fail at startup in 1s with no logs.
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-latest
    environment: TEST
    # Run GitHub always; run Gitea only when TEST_GITEA_REPO is configured.
    # Note: job-level "if" with matrix context can fail when workflow is called; we skip Gitea in step instead.
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: github
            repo: ${{ vars.TEST_GITHUB_REPO || 'LiquidLogicLabs/git-action-release-tests' }}
            baseUrl: ''
            repoPath: ${{ vars.TEST_GITHUB_REPO || 'LiquidLogicLabs/git-action-release-tests' }}
          - platform: gitea
            repo: ${{ vars.TEST_GITEA_REPO || 'skip' }}
            baseUrl: ${{ vars.TEST_GITEA_BASE_URL || 'https://git.ravenwolf.org' }}
            repoPath: ${{ vars.TEST_GITEA_REPO_PATH || vars.TEST_GITEA_REPO || 'skip' }}
    env:
      TEST_TOKEN: ${{ matrix.platform == 'github' && secrets.TEST_GITHUB_TOKEN || secrets.TEST_GITEA_TOKEN }}
      GITEA_RELEASE_LOOKUP_BASE_DELAY_MS: ${{ matrix.platform == 'gitea' && '1500' || '' }}
      GITEA_RELEASE_LOOKUP_MAX_DELAY_MS: ${{ matrix.platform == 'gitea' && '12000' || '' }}
      GITEA_ACTIONS: ${{ matrix.platform == 'gitea' && 'true' || '' }}
      GITEA_WORKSPACE: ${{ matrix.platform == 'gitea' && github.workspace || '' }}
      GITEA_SERVER_URL: ${{ matrix.platform == 'gitea' && matrix.baseUrl || '' }}
      GITEA_REPOSITORY: ${{ matrix.platform == 'gitea' && matrix.repoPath || '' }}
      GITEA_BASE_URL: ${{ matrix.platform == 'gitea' && matrix.baseUrl || '' }}
      GITHUB_SERVER_URL: ${{ matrix.platform == 'gitea' && matrix.baseUrl || '' }}
      GITHUB_REPOSITORY: ${{ matrix.platform == 'gitea' && matrix.repoPath || '' }}
    steps:
      - name: Skip if Gitea not configured
        id: skip
        env:
          Z_MATRIX_PLATFORM: ${{ matrix.platform }}
          Z_VARS_TEST_GITEA_REPO: ${{ vars.TEST_GITEA_REPO }}
          Z_MATRIX_REPO: ${{ matrix.repo }}
        run: |
          # Skip Gitea cell when repo is placeholder (var was empty) or var is unset
          if [ "${Z_MATRIX_PLATFORM}" = "gitea" ] && { [ -z "${Z_VARS_TEST_GITEA_REPO}" ] || [ "${Z_MATRIX_REPO}" = "skip" ]; }; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout action code
        if: steps.skip.outputs.skip != 'true'
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          # No step in this job pushes to this repository; the release/tag operations
          # in this job target the separate test repository using TEST_TOKEN.
          persist-credentials: false

      - name: Install GitHub CLI (GitHub only)
        if: steps.skip.outputs.skip != 'true' && matrix.platform == 'github'
        uses: sersoft-gmbh/setup-gh-cli-action@3cb41a4434ca35de4d1c16e00dc7e16d38409494 # v3

      - name: Install Tea CLI (Gitea only)
        if: steps.skip.outputs.skip != 'true' && matrix.platform == 'gitea'
        # zizmor: ignore[unpinned-uses] — first-party action; no Renovate or
        # Dependabot exists in these repos, so a SHA pin would freeze it and stop
        # security fixes reaching us through @v2.
        uses: LiquidLogicLabs/git-action-install-gitea-tea@v2
        with:
          version: 'latest'
          token: ${{ secrets.TEST_GITEA_TOKEN }}
          repo: ${{ matrix.baseUrl }}

      - name: Generate unique test tag
        if: steps.skip.outputs.skip != 'true'
        id: test_tag
        env:
          Z_MATRIX_PLATFORM: ${{ matrix.platform }}
          Z_RUN_ID: ${{ github.run_id }}
          Z_RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          TEST_TAG="test-e2e-${Z_MATRIX_PLATFORM}-${Z_RUN_ID}-${Z_RUN_ATTEMPT}-$(date +%s)"
          echo "tag=$TEST_TAG" >> "$GITHUB_OUTPUT"
          echo "Generated test tag: $TEST_TAG"

      - name: Test - Create release
        if: steps.skip.outputs.skip != 'true'
        id: create_release
        uses: ./  # zizmor: ignore[self-repository] — local ACTION reference under test, not a reusable-workflow call; $/ does not apply
        with:
          token: ${{ env.TEST_TOKEN }}
          platform: ${{ matrix.platform }}
          repository: ${{ matrix.repo }}
          tag: ${{ steps.test_tag.outputs.tag }}
          name: E2E Test Release ${{ steps.test_tag.outputs.tag }}
          body: This is a test release created by E2E tests
          verbose: true

      - name: Verify release outputs
        if: steps.skip.outputs.skip != 'true'
        env:
          Z_CREATE_RELEASE_OUTPUTS_ID: ${{ steps.create_release.outputs.id }}
          Z_CREATE_RELEASE_OUTPUTS_HTML_URL: ${{ steps.create_release.outputs.html-url }}
        run: |
          if [ -z "${Z_CREATE_RELEASE_OUTPUTS_ID}" ]; then
            echo "❌ Release ID is missing"
            exit 1
          fi
          if [ -z "${Z_CREATE_RELEASE_OUTPUTS_HTML_URL}" ]; then
            echo "❌ Release HTML URL is missing"
            exit 1
          fi
          echo "✅ Release created successfully"
          echo "  ID: ${Z_CREATE_RELEASE_OUTPUTS_ID}"
          echo "  URL: ${Z_CREATE_RELEASE_OUTPUTS_HTML_URL}"

      - name: Test - Update release
        if: steps.skip.outputs.skip != 'true'
        id: update_release
        uses: ./  # zizmor: ignore[self-repository] — local ACTION reference under test, not a reusable-workflow call; $/ does not apply
        with:
          token: ${{ env.TEST_TOKEN }}
          platform: ${{ matrix.platform }}
          repository: ${{ matrix.repo }}
          tag: ${{ steps.test_tag.outputs.tag }}
          name: E2E Test Release Updated ${{ steps.test_tag.outputs.tag }}
          body: This release has been updated by E2E tests
          allow-updates: true

      - name: Verify update outputs
        if: steps.skip.outputs.skip != 'true'
        env:
          Z_UPDATE_RELEASE_OUTPUTS_ID: ${{ steps.update_release.outputs.id }}
          Z_CREATE_RELEASE_OUTPUTS_ID: ${{ steps.create_release.outputs.id }}
        run: |
          if [ "${Z_UPDATE_RELEASE_OUTPUTS_ID}" != "${Z_CREATE_RELEASE_OUTPUTS_ID}" ]; then
            echo "❌ Release ID changed during update (expected same ID)"
            exit 1
          fi
          echo "✅ Release updated successfully"

      - name: Configure Tea CLI (Gitea only)
        if: steps.skip.outputs.skip != 'true' && matrix.platform == 'gitea'
        env:
          Z_MATRIX_BASEURL: ${{ matrix.baseUrl }}
          Z_TEST_TOKEN: ${{ env.TEST_TOKEN }}
        run: |
          echo "Configuring Tea CLI for ${Z_MATRIX_BASEURL}"
          tea login add --name gitea --url "${Z_MATRIX_BASEURL}" --token "${Z_TEST_TOKEN}" || true

      - name: Cleanup - Delete release
        if: always() && steps.skip.outputs.skip != 'true'
        env:
          # Merged into the single env: block this step already had. The hoist aid appends
          # a second one before run:, and YAML accepts a duplicate key silently (last wins)
          # -- actionlint is what catches it.
          GITHUB_TOKEN: ${{ matrix.platform == 'github' && env.TEST_TOKEN || '' }}
          Z_MATRIX_PLATFORM: ${{ matrix.platform }}
          Z_MATRIX_REPO: ${{ matrix.repo }}
          Z_TEST_TAG_OUTPUTS_TAG: ${{ steps.test_tag.outputs.tag }}
          Z_MATRIX_REPOPATH: ${{ matrix.repoPath }}
        run: |
          if [ "${Z_MATRIX_PLATFORM}" == "github" ]; then
            REPO="${Z_MATRIX_REPO}"
            gh release delete "${Z_TEST_TAG_OUTPUTS_TAG}" --repo "$REPO" --yes || true
            gh api -X DELETE "/repos/$REPO/git/refs/tags/${Z_TEST_TAG_OUTPUTS_TAG}" || true
          else
            REPO="${Z_MATRIX_REPOPATH}"
            TAG="${Z_TEST_TAG_OUTPUTS_TAG}"
            echo "Deleting Gitea release: ${TAG} from ${REPO}"
            tea release delete "${TAG}" --confirm --delete-tag --repo "${REPO}" || true
            echo "✅ Cleaned up Gitea release: ${TAG}"
          fi
